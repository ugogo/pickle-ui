name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per check, so they run side by side instead of one after another.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint & format
            run: pnpm run lint && pnpm run format:check
          - name: Typecheck
            run: pnpm run typecheck
          # Every package but React Native, so a new package is tested here.
          - name: Test
            run: pnpm --filter './packages/*' --filter '!@pickle-ui/react-native' run test
          - name: Test (react-native)
            run: pnpm --filter @pickle-ui/react-native run test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
