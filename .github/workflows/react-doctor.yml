name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: React Doctor (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [react, react-native]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # No install: the action sets up Node and its own react-doctor, which
      # loads `doctor.config.ts` without the project's dependencies. If
      # `only-export-components` warnings appear on the web package, the
      # config stopped loading.
      - name: Run React Doctor
        uses: millionco/react-doctor@v2
        with:
          # The version each package pins, so CI and the pre-commit hook run
          # the same rules.
          version: 0.9.18
          directory: packages/${{ matrix.package }}
