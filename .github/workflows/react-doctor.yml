name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: React Doctor (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [react, react-native]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # `doctor.config.ts` imports `react-doctor/api`. Without the install, the
      # config silently fails to load and the action runs its default rules.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run React Doctor
        uses: millionco/react-doctor@v2
        with:
          # The version each package pins, so CI and the pre-commit hook run
          # the same rules.
          version: 0.9.18
          directory: packages/${{ matrix.package }}
