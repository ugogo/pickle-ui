name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      preid:
        description: Pre-release identifier (e.g. beta), published under that npm dist-tag; empty for a stable release
        required: false
        default: ''
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.bump }} ${{ inputs.preid }} version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check lint and formatting
        run: |
          pnpm run lint
          pnpm run format:check

      - name: Configure release commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch --set-upstream-to=origin/main main

      # release-it bumps every package to one shared version, publishes them
      # (scripts/publish-packages.sh), then commits, tags and creates the GitHub Release
      - name: Release
        run: |
          args=("$BUMP" --ci)
          if [ -n "$PREID" ]; then
            if [[ ! "$PREID" =~ ^[a-z]+$ ]]; then
              echo "::error::preid must be lowercase letters (e.g. beta)"
              exit 1
            fi
            # Pre-releases go to their own dist-tag and never become the latest GitHub release
            args+=(--preRelease="$PREID" --github.makeLatest=false)
            export NPM_TAG="$PREID"
          elif [ "$BUMP" = prerelease ]; then
            echo "::error::bump=prerelease requires a preid"
            exit 1
          fi
          pnpm exec release-it "${args[@]}"
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
