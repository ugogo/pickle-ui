<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickle UI · Web example</title>
    <script>
      // Pick the color scheme before the first paint, so dark mode never
      // flashes light. ThemeControls.tsx keeps it in sync afterwards.
      try {
        const scheme = localStorage.getItem('pickle-example-scheme');
        const dark =
          scheme === 'dark' ||
          (scheme !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
